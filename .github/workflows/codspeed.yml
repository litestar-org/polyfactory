name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed run past commits to build up initial history.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks --codspeed
